version: '3.8'
networks:
  bank-networks:
    driver: bridge
volumes:
  postgres-auth-data:
  postgres-account-data:
  postgres-transaction-data:
  postgres-deposit-data:
  postgres-notification-data:
  redis-auth-data:
  redis-gateway-data:
  kafka-data:
services:
  postgres-auth:
    image: postgres:15-alpine
    container_name: bank-postgres-auth
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  postgres-notification:
    image: postgres:15-alpine
    container_name: bank-postgres-notification
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: notification_db
    ports:
      - "5434:5432"
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    networks:
      - bank-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dev -d notification_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  postgres-account:
    image: postgres:15-alpine
    container_name: bank-postgres-account
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: account_db
    ports:
      - "5435:5432"
    volumes:
      - postgres-account-data:/var/lib/postgresql/data
    networks:
      - bank-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dev -d account_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  postgres-transaction:
    image: postgres:15-alpine
    container_name: bank-postgres-transaction
    environment:
      POSTGRES_NAME: dev
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: transaction_db
    ports:
      - "5436:5432"
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d transaction_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  postgres-deposit:
    image: postgres:15-alpine
    container_name: bank-postgres-deposit
    environment:
      POSTGRES_NAME: dev
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: deposit_db
    ports:
      - "5437:5432"
    networks:
      - bank-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dev -d deposit_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis-auth:
    image: redis:7.2-alpine
    container_name: bank-redis-auth
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123
    volumes:
      - redis-auth-data:/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis-gateway:
    image: redis:7.2-alpine
    container_name: bank-redis-gateway
    command: redis-server --requirepass redis123
    ports:
      - "6380:6379"
    volumes:
      - redis-api-gateway:/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  kafka-server:
    image: apache/kafka:3.8.0
    container_name: bank-kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@localhost:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped