version: '3.8'
networks:
  bank-network:
    driver: bridge
volumes:
  postgres-auth-data:
  postgres-account-data:
  postgres-transaction-data:
  postgres-deposit-data:
  postgres-notification-data:
  redis-auth-data:
  redis-gateway-data:
  kafka-data:
services:

  postgres-auth:
    image: postgres:15-alpine
    container_name: bank-postgres-auth
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-notification:
    image: postgres:15-alpine
    container_name: bank-postgres-notification
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: notification_db
    ports:
      - "5434:5432"
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    networks:
      - bank-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dev -d notification_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-account:
    image: postgres:15-alpine
    container_name: bank-postgres-account
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: account_db
    ports:
      - "5435:5432"
    volumes:
      - postgres-account-data:/var/lib/postgresql/data
    networks:
      - bank-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dev -d account_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-transaction:
    image: postgres:15-alpine
    container_name: bank-postgres-transaction
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: transaction_db
    ports:
      - "5436:5432"
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d transaction_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-deposit:
    image: postgres:15-alpine
    container_name: bank-postgres-deposit
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: deposit_db
    ports:
      - "5437:5432"
    networks:
      - bank-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dev -d deposit_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-auth:
    image: redis:7.2-alpine
    container_name: bank-redis-auth
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123
    volumes:
      - redis-auth-data:/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-gateway:
    image: redis:7.2-alpine
    container_name: bank-redis-gateway
    command: redis-server --requirepass redis123
    ports:
      - "6380:6379"
    volumes:
      - redis-gateway-data:/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka-server:
    image: apache/kafka:3.8.0
    container_name: bank-kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-server:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-server:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - bank-network
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-server:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  discovery-service:
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    container_name: bank-discovery-service
    ports:
      - "8761:8761"
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8761/actuator/health | grep -qE '200|401|403' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  config-service:
    build:
      context: .
      dockerfile: config-service/Dockerfile
    container_name: bank-config-service
    ports:
      - "8880:8880"
    environment:
      EUREKA_URL: http://eureka:eureka123@discovery-service:8761/eureka
      KAFKA_BOOTSTRAP_SERVERS: kafka-server:9092
    networks:
      - bank-network
    depends_on:
      discovery-service:
        condition: service_healthy
      kafka-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8880/actuator/health | grep -qE '200|401|403' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: bank-api-gateway
    ports:
      - "8092:8092"
    environment:
      EUREKA_URL: http://eureka:eureka123@discovery-service:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka-server:9092
      CONFIG_DISCOVERY_ENABLED: "true"
      CONFIG_SERVICE_ID: config-service
      CONFIG_USERNAME: config
      CONFIG_PASSWORD: config123
      REDIS_HOST: redis-gateway
      REDIS_PORT: 6380
      REDIS_PASSWORD: redis123
    networks:
      - bank-network
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      kafka-server:
        condition: service_healthy
      redis-gateway:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8092/actuator/health | grep -qE '200|401|403' || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 180s
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: bank-auth-service
    ports:
      - "8090:8090"
    environment:
      EUREKA_URL: http://eureka:eureka123@discovery-service:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka-server:9092
      CONFIG_DISCOVERY_ENABLE: "true"
      CONFIG_SERVICE_ID: config-service
      CONFIG_USERNAME: config
      CONFIG_PASSWORD: config123
      POSTGRES_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      POSTGRES_USERNAME: dev
      POSTGRES_PASSWORD: dev123
      REDIS_HOST: redis-auth
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
    networks:
      - bank-network
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      postgres-auth:
        condition: service_healthy
      redis-auth:
        condition: service_healthy
      kafka-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/actuator/health | grep -qE '200|401|403' || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 180s
    restart: unless-stopped

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    container_name: bank-account-service
    ports:
      - "8094:8094"
    environment:
      EUREKA_URL: http://eureka:eureka123@discovery-service:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka-server:9092
      CONFIG_DISCOVERY_ENABLE: "true"
      CONFIG_SERVICE_ID: config-service
      CONFIG_USERNAME: config
      CONFIG_PASSWORD: config123
      POSTGRES_URL: jdbc:postgresql://postgres-account:5432/account_db
      POSTGRES_USERNAME: dev
      POSTGRES_PASSWORD: dev123
    networks:
      - bank-network
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      kafka-server:
        condition: service_healthy
      postgres-account:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8094/actuator/health | grep -qE '200|401|403' || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 180s
    restart: unless-stopped

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    container_name: bank-transaction-service
    ports:
      - "8095:8095"
    environment:
      EUREKA_URL: http://eureka:eureka123@discovery-service:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka-server:9092
      CONFIG_DISCOVERY_ENABLE: "true"
      CONFIG_SERVICE_ID: config-service
      CONFIG_USERNAME: config
      CONFIG_PASSWORD: config123
      POSTGRES_URL: jdbc:postgresql://postgres-transaction:5432/transaction_db
      POSTGRES_USERNAME: dev
      POSTGRES_PASSWORD: dev123
    networks:
      - bank-network
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      kafka-server:
        condition: service_healthy
      postgres-transaction:
        condition: service_healthy
      account-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8095/actuator/health | grep -qE '200|401|403' || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 180s
    restart: unless-stopped

  deposit-service:
    build:
      context: .
      dockerfile: deposit-service/Dockerfile
    container_name: bank-deposit-service
    ports:
      - "8096:8096"
    environment:
      EUREKA_URL: http://eureka:eureka123@discovery-service:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka-server:9092
      CONFIG_DISCOVERY_ENABLE: "true"
      CONFIG_SERVICE_ID: config-service
      CONFIG_USERNAME: config
      CONFIG_PASSWORD: config123
      POSTGRES_URL: jdbc:postgresql://postgres-deposit:5432/deposit_db
      POSTGRES_USERNAME: dev
      POSTGRES_PASSWORD: dev123
    networks:
      - bank-network
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      kafka-server:
        condition: service_healthy
      postgres-account:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8096/actuator/health | grep -qE '200|401|403' || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 180s
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: bank-notification-service
    ports:
      - "8093:8093"
    environment:
      EUREKA_URL: http://eureka:eureka123@discovery-service:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka-server:9092
      CONFIG_DISCOVERY_ENABLE: "true"
      CONFIG_SERVICE_ID: config-service
      CONFIG_USERNAME: config
      CONFIG_PASSWORD: config123
      POSTGRES_URL: jdbc:postgresql://postgres-notification:5432/notification_db
      POSTGRES_USERNAME: dev
      POSTGRES_PASSWORD: dev123
    networks:
      - bank-network
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      kafka-server:
        condition: service_healthy
      postgres-notification:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8093/actuator/health | grep -qE '200|401|403' || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 180s
    restart: unless-stopped
